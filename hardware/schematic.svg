<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1120" height="620" fill="#f8fafc"/>

  <!-- Title Banner -->
  <text x="560" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">
    Switch2 Pico Audio Pack Bridge — Hardware Interconnect Schematic (MIT License)
  </text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#475569">
    Dual Raspberry Pi Pico 2 H (RP2350) + 33-ohm Isolated 3 Mbps UART Link + Pimoroni Pico Audio Pack (PCM5100A / PAM8908)
  </text>

  <!-- CONSOLE HOST -->
  <rect x="28" y="120" width="130" height="96" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="93" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Console Host</text>
  <text x="93" y="176" text-anchor="middle" font-size="11" fill="#334155">USB Audio 1.0</text>
  <text x="93" y="194" text-anchor="middle" font-size="11" fill="#334155">48kHz / 16bit 2ch</text>
  <line x1="158" y1="168" x2="215" y2="168" stroke="#0284c7" stroke-width="4"/>
  <text x="186" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">USB</text>

  <!-- U1: Pico 1 TX Bridge -->
  <rect x="215" y="96" width="235" height="230" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <rect x="215" y="146" width="18" height="44" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <text x="332" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">U1: Pico 2 H (TX Bridge)</text>
  <text x="332" y="142" text-anchor="middle" font-size="11" fill="#166534">firmware/tx-bridge (RP2350)</text>
  <text x="332" y="160" text-anchor="middle" font-size="11" fill="#166534">USB Powered from Console</text>

  <!-- U1 Pins (Right side) -->
  <rect x="352" y="182" width="98" height="24" rx="4" fill="#ffffff" stroke="#15803d"/>
  <text x="401" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 1: GP0 (TX)</text>

  <rect x="352" y="222" width="98" height="24" rx="4" fill="#ffffff" stroke="#15803d"/>
  <text x="401" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 3: GND</text>

  <!-- U1 Power Isolation Tag -->
  <rect x="232" y="266" width="202" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="333" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">ISOLATED POWER RAILS</text>
  <text x="333" y="300" text-anchor="middle" font-size="10" fill="#b91c1c">Do NOT connect Pin 40 VBUS / VSYS / 3V3</text>

  <!-- R1 33-ohm UART Link -->
  <line x1="450" y1="194" x2="492" y2="194" stroke="#d97706" stroke-width="3"/>
  <rect x="492" y="180" width="66" height="28" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="525" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">R1 33&#937;</text>
  <line x1="558" y1="194" x2="600" y2="194" stroke="#d97706" stroke-width="3"/>
  <text x="525" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">3 Mbps UART DMA</text>
  <text x="525" y="219" text-anchor="middle" font-size="10" fill="#64748b">(1/4W series resistor)</text>

  <!-- Common GND Wire -->
  <line x1="450" y1="234" x2="600" y2="234" stroke="#1e293b" stroke-width="3"/>
  <text x="525" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Common GND</text>

  <!-- Power Isolation Divider -->
  <line x1="525" y1="274" x2="525" y2="338" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="525" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">No Power Wire Here</text>

  <!-- U2: Pico 2 RX Mixer -->
  <rect x="600" y="96" width="245" height="398" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="827" y="146" width="18" height="44" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <text x="722" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">U2: Pico 2 H (RX Mixer)</text>
  <text x="722" y="142" text-anchor="middle" font-size="11" fill="#1e40af">firmware/rx-mixer (RP2350)</text>
  <text x="722" y="160" text-anchor="middle" font-size="11" fill="#1e40af">USB Powered from PC Host</text>

  <!-- U2 Left RX Pins -->
  <rect x="600" y="182" width="114" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="657" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 17: GP13 (RX)</text>

  <rect x="600" y="222" width="114" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="657" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 23: GND</text>

  <!-- U2 Right / Bottom Output Pins to Audio Pack -->
  <rect x="698" y="266" width="147" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="771" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 39: VSYS (5V)</text>

  <rect x="698" y="296" width="147" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="771" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 38: GND</text>

  <rect x="698" y="326" width="147" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="771" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 36: 3V3 (3.3V)</text>

  <rect x="698" y="356" width="147" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="771" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 29: GP22 (MUTE)</text>

  <rect x="698" y="386" width="147" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="771" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 12: GP9 (DATA)</text>

  <rect x="698" y="416" width="147" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="771" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 14: GP10 (BCK)</text>

  <rect x="698" y="446" width="147" height="24" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="771" y="462" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Pin 15: GP11 (LRCK)</text>

  <!-- PC HOST -->
  <line x1="845" y1="168" x2="950" y2="168" stroke="#0284c7" stroke-width="4"/>
  <text x="898" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">USB</text>
  <rect x="950" y="114" width="145" height="106" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="1022" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Windows PC Host</text>
  <text x="1022" y="162" text-anchor="middle" font-size="10" fill="#334155">SPK OUT: PC Mix Input</text>
  <text x="1022" y="178" text-anchor="middle" font-size="10" fill="#334155">MIC IN: OBS Raw Capture</text>
  <text x="1022" y="194" text-anchor="middle" font-size="10" fill="#334155">HID: DSP / EQ Control</text>

  <!-- 7 I2S + Power Wires U2 -> U3 -->
  <line x1="845" y1="278" x2="915" y2="278" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="845" y1="308" x2="915" y2="308" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="845" y1="338" x2="915" y2="338" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="845" y1="368" x2="915" y2="368" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="845" y1="398" x2="915" y2="398" stroke="#0d9488" stroke-width="2.5"/>
  <line x1="845" y1="428" x2="915" y2="428" stroke="#0d9488" stroke-width="2.5"/>
  <line x1="845" y1="458" x2="915" y2="458" stroke="#0d9488" stroke-width="2.5"/>

  <!-- U3: Pimoroni Pico Audio Pack -->
  <rect x="915" y="242" width="180" height="252" rx="10" fill="#fae8ff" stroke="#86198f" stroke-width="2.5"/>
  <text x="1005" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#701a75">U3: Pico Audio Pack</text>
  <text x="1005" y="280" text-anchor="middle" font-size="10" fill="#86198f">PCM5100A + PAM8908 (Low Gain)</text>

  <text x="928" y="282" font-size="10" fill="#0f172a"> </text>
  <rect x="926" y="294" width="158" height="178" rx="6" fill="#ffffff" stroke="#a21caf"/>
  <text x="936" y="312" font-size="11" fill="#0f172a">Pin 39: VSYS (Amp 5V)</text>
  <text x="936" y="334" font-size="11" fill="#0f172a">Pin 38: GND</text>
  <text x="936" y="356" font-size="11" fill="#0f172a">Pin 36: 3V3 (DAC)</text>
  <text x="936" y="378" font-size="11" fill="#0f172a">Pin 29: MUTE (GP22=1)</text>
  <text x="936" y="400" font-size="11" fill="#0f172a">Pin 12: I2S DATA</text>
  <text x="936" y="422" font-size="11" fill="#0f172a">Pin 14: I2S BCK (64fs)</text>
  <text x="936" y="444" font-size="11" fill="#0f172a">Pin 15: I2S LRCK (48k)</text>
  <text x="1005" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#86198f">3.5mm Headphone Out (Low Gain)</text>

  <!-- Footnote -->
  <rect x="28" y="518" width="1064" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="542" font-size="12" font-weight="bold" fill="#0f172a">Design &amp; Assembly Notes:</text>
  <text x="44" y="562" font-size="11" fill="#334155">1. Solderless assembly on an MB-102 breadboard with 9 male-male jumper wires (or 7 male-male + 2 male-female) and 1x 33-ohm 1/4W resistor.</text>
  <text x="44" y="580" font-size="11" fill="#334155">2. U1 and U2 share ONLY UART signal (via R1) and GND. Leave VBUS (Pin 40), VSYS (Pin 39), and 3V3 (Pin 36) unconnected between U1 and U2.</text>
</svg>
